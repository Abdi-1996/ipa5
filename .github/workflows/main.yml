name: Build PC Remote 4.4

on:
  workflow_dispatch:

jobs:
  ios:
    name: Build iPhone IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and build Xcode project
        run: |
          set -euo pipefail

          echo "PC Remote source version: 4.4"

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "PCRemote.xcodeproj" \
            -print \
            -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: PCRemote.xcodeproj не найден"
            exit 1
          fi

          echo "Using $PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme PCRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="$(find "$GITHUB_WORKSPACE/ios-build/Build/Products/Release-iphoneos" \
            -type d \
            -name "PCRemote.app" \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: PCRemote.app не найден"
            exit 1
          fi

          rm -rf Payload PCRemote.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/PCRemote.app
          /usr/bin/zip -qry PCRemote.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-4.4-IPA
          path: PCRemote.ipa
          if-no-files-found: error

  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build server EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          $gui = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter gui.py |
            Where-Object {
              $_.FullName -match '[\\/]windows[\\/]gui.py$'
            } |
            Select-Object -First 1

          if (-not $gui) {
            throw "windows/gui.py not found"
          }

          $windowsDir = $gui.Directory.FullName

          python -m pip install -r "$windowsDir\requirements.txt"
          python -m pip install pyinstaller

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths "$windowsDir" `
            --collect-all mss `
            --collect-all pyautogui `
            --collect-all comtypes `
            --hidden-import pyperclip `
            --hidden-import psutil `
            --hidden-import websocket `
            --hidden-import winreg `
            --name PCRemoteServer `
            "$($gui.FullName)"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote-4.4-Windows
          path: dist/PCRemoteServer.exe
          if-no-files-found: error
