name: Build PC Remote

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # iPhone IPA
  # ==========================================
  ios:
    name: Build iPhone IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "PCRemote.xcodeproj" \
            -print \
            -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "PCRemote.xcodeproj not found"
            exit 1
          fi

          echo "Found project:"
          echo "$PROJECT_PATH"

          echo "path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Build iPhone app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "${{ steps.project.outputs.path }}" \
            -scheme PCRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Find built app
        id: app
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find \
            "$GITHUB_WORKSPACE/ios-build/Build/Products/Release-iphoneos" \
            -type d \
            -name "PCRemote.app" \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "PCRemote.app not found"
            exit 1
          fi

          echo "Built app:"
          echo "$APP_PATH"

          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      # ВАЖНО:
      # Принудительно разрешаем HTTP для LAN и Tailscale.
      # Это предотвращает ошибку App Transport Security.
      - name: Apply ATS settings
        shell: bash
        run: |
          set -euo pipefail

          INFO_PLIST="${{ steps.app.outputs.path }}/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "Built Info.plist not found"
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c "Delete :NSAppTransportSecurity" \
            "$INFO_PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity dict" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" \
            "$INFO_PLIST"

          echo "Final ATS:"
          /usr/libexec/PlistBuddy \
            -c "Print :NSAppTransportSecurity" \
            "$INFO_PLIST"

      - name: Verify ATS
        shell: bash
        run: |
          set -euo pipefail

          INFO_PLIST="${{ steps.app.outputs.path }}/Info.plist"

          ATS_VALUE="$(
            /usr/libexec/PlistBuddy \
            -c "Print :NSAppTransportSecurity:NSAllowsArbitraryLoads" \
            "$INFO_PLIST"
          )"

          LOCAL_VALUE="$(
            /usr/libexec/PlistBuddy \
            -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" \
            "$INFO_PLIST"
          )"

          echo "NSAllowsArbitraryLoads = $ATS_VALUE"
          echo "NSAllowsLocalNetworking = $LOCAL_VALUE"

          if [ "$ATS_VALUE" != "true" ]; then
            echo "ATS HTTP permission missing"
            exit 1
          fi

          if [ "$LOCAL_VALUE" != "true" ]; then
            echo "Local networking permission missing"
            exit 1
          fi

          echo "ATS verification passed"

      - name: Show app version
        shell: bash
        run: |
          INFO_PLIST="${{ steps.app.outputs.path }}/Info.plist"

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$INFO_PLIST" || true

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$INFO_PLIST" || true

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf Payload
          rm -f PCRemote.ipa

          mkdir -p Payload

          cp -R \
            "${{ steps.app.outputs.path }}" \
            "Payload/PCRemote.app"

          /usr/bin/zip -qry \
            PCRemote.ipa \
            Payload

          if [ ! -f PCRemote.ipa ]; then
            echo "IPA creation failed"
            exit 1
          fi

          echo "IPA created successfully"
          ls -lh PCRemote.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: PCRemote-IPA
          path: PCRemote.ipa
          if-no-files-found: error


  # ==========================================
  # Windows Server EXE
  # ==========================================
  windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Find Windows server
        id: server
        shell: pwsh
        run: |
          $gui = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -File `
            -Filter gui.py |
            Where-Object {
              $_.FullName -match '[\\/]windows[\\/]gui\.py$'
            } |
            Select-Object -First 1

          if (-not $gui) {
            throw "windows/gui.py not found"
          }

          Write-Host "Found Windows server:"
          Write-Host $gui.FullName

          "gui=$($gui.FullName)" >> $env:GITHUB_OUTPUT
          "dir=$($gui.Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          $requirements = "${{ steps.server.outputs.dir }}\requirements.txt"

          if (Test-Path $requirements) {
            Write-Host "Installing requirements.txt"
            python -m pip install -r $requirements
          }
          else {
            Write-Host "requirements.txt not found - continuing"
          }

          python -m pip install --upgrade pyinstaller

      - name: Build PC Remote Server
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths "${{ steps.server.outputs.dir }}" `
            --collect-all mss `
            --collect-all pyautogui `
            --collect-all comtypes `
            --hidden-import pyperclip `
            --hidden-import psutil `
            --hidden-import websocket `
            --hidden-import winreg `
            --name PCRemoteServer `
            "${{ steps.server.outputs.gui }}"

      - name: Verify Windows EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\PCRemoteServer.exe")) {
            throw "PCRemoteServer.exe was not created"
          }

          Get-Item "dist\PCRemoteServer.exe" |
            Format-List Name, Length, FullName

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v6
        with:
          name: PCRemote-Windows
          path: dist/PCRemoteServer.exe
          if-no-files-found: error
